name: Materialize binary assets
on:
  workflow_dispatch:
  push:
    branches: ["main"]
permissions:
  contents: write
concurrency:
  group: materialize
  cancel-in-progress: false
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Decode assets and commit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          src = Path("assets-b64")
          dest = Path("assets")
          dest.mkdir(exist_ok=True)
          import tarfile, io
          for p in sorted(src.glob("*.tar.b64")):
              data = base64.b64decode("".join(p.read_text().split()))
              with tarfile.open(fileobj=io.BytesIO(data)) as t:
                  for m in t.getmembers():
                      if not m.isfile() or "/" in m.name or m.name.startswith("."):
                          continue
                      out = dest / m.name
                      b = t.extractfile(m).read()
                      if out.exists() and out.read_bytes() == b:
                          continue
                      out.write_bytes(b)
                      print("extracted", out, len(b))
          # split sources: assets-b64/parts/<name>.b64.partN are joined in order
          parts_dir = src / "parts"
          groups = {}
          for p in sorted(parts_dir.glob("*.b64.part*")) if parts_dir.exists() else []:
              groups.setdefault(p.name.rsplit(".part", 1)[0], []).append(p)
          for name, ps in groups.items():
              ps.sort(key=lambda q: int(q.name.rsplit(".part", 1)[1]))
              data = base64.b64decode("".join("".join(q.read_text().split()) for q in ps))
              out = dest / name[:-4]
              if out.exists() and out.read_bytes() == data:
                  continue
              out.write_bytes(data)
              print("joined", out, len(data), "from", len(ps), "parts")
          for p in sorted(src.glob("*.b64")):
              if p.name.endswith(".tar.b64"):
                  continue
              out = dest / p.name[:-4]
              data = base64.b64decode("".join(p.read_text().split()))
              if out.exists() and out.read_bytes() == data:
                  continue
              out.write_bytes(data)
              print("wrote", out, len(data))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "No asset changes to commit"
            exit 0
          fi
          git commit -m "Decode binary assets for the landing preview"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
