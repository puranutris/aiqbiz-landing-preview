name: Materialize image assets
on:
  workflow_dispatch:
  push:
    branches: ["main"]
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode JPEGs and commit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          src = Path("assets-b64")
          dest = Path("assets")
          dest.mkdir(exist_ok=True)
          for p in sorted(src.glob("*.b64")):
              out = dest / p.name[:-4]
              data = base64.b64decode("".join(p.read_text().split()))
              out.write_bytes(data)
              print("wrote", out, len(data))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.jpg
          if git diff --cached --quiet; then
            echo "No JPEG changes to commit"
            exit 0
          fi
          git commit -m "Add decoded JPEG assets for the landing preview"
          git push
