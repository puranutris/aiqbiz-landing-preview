name: Deploy static preview to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p site/assets
          cp index.html robots.txt README.md site/
          cp assets/mark.svg site/assets/
          python3 - <<'PY'
          from pathlib import Path
          import base64
          src = Path("assets-b64")
          if src.exists():
              for p in src.glob("*.b64"):
                  name = p.name[:-4]
                  out = Path("site/assets") / name
                  out.write_bytes(base64.b64decode("".join(p.read_text().split())))
                  print("wrote", out, out.stat().st_size)
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
